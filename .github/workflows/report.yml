name: Rebuild commute report

# Rebuilt right after each sampling window closes, so the report reflects a
# window as soon as it is complete rather than up to a week later.
#
#   morning   ends 11:00 PT -> rebuild 11:15 PT
#   afternoon ends 17:30 PT -> rebuild 18:00 PT ("at night")
#
# Pacific is UTC-7 (PDT) in summer and UTC-8 (PST) in winter, and cron has no
# time zone, so each rebuild fires at both offsets. The off-offset run finds the
# report already current and exits without committing, so the cost is one no-op
# job -- much cheaper than getting the hour wrong for half the year.
on:
  schedule:
    - cron: "15 18 * * *"   # 11:15 PT (PDT) -- after the morning window
    - cron: "15 19 * * *"   # 11:15 PT (PST) -- after the morning window
    - cron: "0 1 * * *"     # 18:00 PT (PDT) -- after the afternoon window
    - cron: "0 2 * * *"     # 18:00 PT (PST) -- after the afternoon window
  workflow_dispatch:

concurrency:
  group: commute-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and commit the report
        run: |
          set -euo pipefail

          git config user.name  "commute-bot"
          git config user.email "commute-bot@users.noreply.github.com"

          # The report must describe the data committed alongside it.
          #
          # A sample run commits new CSV rows every 15 minutes and can land at
          # any point during this job, so the ordering matters:
          #
          #   1. pull first, so the report is built from current data;
          #   2. build, then decide whether anything actually changed;
          #   3. push -- and if that is rejected, a sample landed mid-build, so
          #      discard the attempt and rebuild against the newer rows.
          #
          # Building before the pull -- or exiting early on "unchanged" without
          # first confirming we are level with the remote -- publishes a report
          # that silently disagrees with the CSVs in its own commit.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

            python3 scripts/analyze.py

            if [ -z "$(git status --porcelain report.md report.html)" ]; then
              # The report matches the data we built from -- but only trust
              # that if no sample has landed since the pull above. Otherwise
              # loop round and rebuild against the newer rows.
              git fetch --quiet origin "${GITHUB_REF_NAME}"
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${GITHUB_REF_NAME}")" ]; then
                echo "Report already matches the committed data."
                exit 0
              fi
              echo "New samples landed while building; rebuilding (attempt $attempt)..."
              continue
            fi

            git add report.md report.html
            git commit -m "report: refresh $(date -u +'%Y-%m-%d')"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            # A sample landed while we were building. Drop this commit and
            # rebuild against the newer data rather than pushing a stale report.
            echo "Push rejected, rebuilding against newer data (attempt $attempt)..."
            git reset --hard HEAD~1
            sleep $((attempt * 3))
          done

          echo "Could not push the report after 5 attempts." >&2
          exit 1
