name: Sample commute times

# Scheduling lives in the Cloudflare Worker (see worker/ and the README), not
# here. GitHub's cron is best-effort and silently skips slots under load, which
# puts holes in the time-of-day curve at exactly the busy hours that matter.
# The Worker fires workflow_dispatch on time instead; this workflow only ever
# runs on demand.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Sample even if outside the normal window"
        type: boolean
        default: false
      mock:
        description: "Use fabricated durations (no API call, no key needed)"
        type: boolean
        default: false

# Serialize samples so two never race to commit the same CSV. The report job
# uses its own group: sharing one group means a queued sample is discarded
# whenever another run is already pending, which silently drops slots.
concurrency:
  group: commute-sample
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Take a sample
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          COMMUTE_ROUTES_JSON: ${{ secrets.COMMUTE_ROUTES_JSON }}
        run: |
          python3 scripts/sample_commute.py \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.mock && '--mock' || '' }}

      - name: Commit the log and the report
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Nothing new to commit."
            exit 0
          fi

          git config user.name  "commute-bot"
          git config user.email "commute-bot@users.noreply.github.com"

          # Two runs appending to the same CSV is a *content* conflict at the
          # end of the file, which plain `git pull --rebase` stops on. The rows
          # are append-only (sample_commute.py never rewrites a line), so a
          # union merge is exactly right: keep both sides' new rows.
          git config merge.union.driver 'git merge-file --union -- %A %O %B'
          echo "data/*.csv merge=union" >> .git/info/attributes

          # Rebuild the report from the rows we just wrote, and ship both in one
          # commit. Because the report is built after the merge on every retry,
          # it always describes exactly the CSVs it is committed with -- the
          # report can no longer lag the data or disagree with it.
          python3 scripts/analyze.py

          git add data report.md report.html
          git commit --quiet -m "log: $(date -u +'%Y-%m-%dT%H:%MZ') sample"

          for attempt in 1 2 3 4 5; do
            if git push --quiet; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, merging and retrying (attempt $attempt)..."
            # A merge (not a rebase) lets the union driver resolve the CSV.
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            if ! git merge --no-edit --quiet "origin/${GITHUB_REF_NAME}"; then
              echo "Could not merge the log automatically." >&2
              git merge --abort || true
              exit 1
            fi
            # The merge brought in other runs' rows; rebuild so the report
            # matches the merged data, then amend it into this commit.
            python3 scripts/analyze.py
            git add report.md report.html
            git commit --quiet --amend --no-edit
            sleep $((attempt * 3))
          done

          echo "Could not push the log after 5 attempts." >&2
          exit 1
